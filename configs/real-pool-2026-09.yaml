# 真实研究池：用于 T6 真实快照验收
#
# 为什么要有这个文件，而不是在脚本里写死一串代码
# --------------------------------------------------
# 候选池是**研究口径**，不是实现细节。它决定了组合构建的上限约束
# （持仓数、单票权重、行业上限）到底有没有真正的选择压力，也决定了
# 验收结论能外推到多大的范围。写死在脚本里，等于把口径藏在代码里，
# 没人能复核"为什么是这些标的"。
#
# 选择规则（可复现）
# ------------------
# 目标：让组合构建的**上限约束真正生效**，因此池子必须显著大于持仓上限，
# 并且覆盖不同交易所与不同涨跌幅板块。
#
#   1. 只取 A 股主板 / 创业板 / 科创板，不含北交所、不含 ST；
#   2. 按流动性（近 61 个交易日成交额）与市值代表性挑选，
#      每个板块至少 4 只，使 10% 单票上限与 20%/10% 涨跌幅规则都被触及；
#   3. 覆盖多个行业，使行业上限（默认 30%）在池内具有约束力；
#   4. 只保留在数据源上**确实能取到完整 61 日行情**的标的。
#
# 关于来源的一个重要事实
# ----------------------
# 本想用东财股票列表接口（`push2.eastmoney.com/api/qt/clist/get`，
# 沪深 A 股共 5558 只）按成交额自动排序生成池子，测试当天该接口
# 第一次调用成功、随后**连续 RemoteDisconnected**——与 ADR-001 记录的
# "按出口 IP 长时段封锁"完全一致。
#
# 因此这个池子是**显式声明**的，而不是每次运行自动发现的：
# 自动发现依赖一个会封 IP 的接口，会让验收结果时好时坏；
# 而池子一旦显式化，它就成了可复核、可归档的输入。
# 选择规则写在上面，任何人都能按同一规则重新生成并对照。

