schema_version: agentctl.product_capabilities.v1
product_id: aquant_lab
display_name: A-Quant Lab
owner: aquant_lab
allowed_tenants:
- aquant-synthetic
default_tenant_id: aquant-synthetic

# Capability surface for A-Quant Lab.
#
# Deliberately ABSENT (main doc 16.3, supplements v0.2.1 4): execute_order,
# write_ledger, run_shell, raw_sql, fetch_arbitrary_url and plan freeze. The
# model has no mechanism to reach them because they are not declared here.
#
# Q5 scope: the read/evidence, portfolio, simulation-preview and experiment
# submit capabilities below are product-owned entry points. They read the
# published snapshot/ledger and submit through the durable research-job store.
# Plan freeze and all trading/escape-hatch capabilities remain undeclared.

capabilities:
- capability_id: aquant.research_card.read
  version: 1.0.0
  title: 读取研究卡
  description: 读取指定证券在固定快照下的研究卡、因子依据与限制；只读，不触发供应商抓取
  when_to_use:
  - 查询某只股票的研究卡
  - 这只股票在固定快照下的因子依据是什么
  - 读取指定快照的证券研究数据
  handler: aquant_lab_agentctl_handlers:research_card_read
  input_schema:
    type: object
    required:
    - instrument_id
    - snapshot_id
    properties:
      instrument_id:
        type: string
        description: 内部稳定证券 ID，例如 SYN.A.600519
      snapshot_id:
        type: string
        description: 已发布快照 ID，例如 snap-syn-001
    additionalProperties: false
  output_schema:
    type: object
    required:
    - ok
    - snapshot_id
    - instrument_id
    - as_of_time
    - data_mode
    properties:
      ok:
        type: boolean
      snapshot_id:
        type: string
      as_of_time:
        type: string
      data_mode:
        type: string
      instrument_id:
        type: string
      factors:
        type: array
      limitations:
        type: array
      listed_on:
        type: string
        description: 上市日期（BaoStock ipoDate）。为空表示未采集到，
          此时"决策时点是否已上市"与"上市未满规定交易日"两条判定不可用
      status:
        type: string
      industry_code:
        type: string
      industry_name:
        type: string
      display_name:
        type: string
      exchange:
        type: string
      board:
        type: string
      watermark:
        type: string
  result_object_types:
  - artifact_ref
  - evidence_ref
  side_effect_class: none
  risk_level: R1
  data_sensitivity: D1
  required_scopes:
  - aquant.research.read
  confirmation_policy: none
  idempotency:
    required: true
    scope: tenant_actor_capability
  # Q1 之前这里指的是合成夹具 SYN.A.600519 / snap-syn-001。handler 接上
  # M1 真实存储之后那两个 ID 不再存在，冒烟必须指向**真实快照**——
  # 否则它验的是一个已经不存在的东西，而且会以「读取失败」的形式
  # 报出来，看起来像能力坏了。
  #
  # 真实快照是构建产物、不进版本库，因此冒烟只在跑过数据流水线的
  # 机器上有意义：先在产品侧 `python tools/daily_run.py` 建快照，
  # 或把 AQUANT_DATA_DIR 指向已有数据目录。
  smoke:
    query: 读取贵州茅台在快照 snap-universe 下的研究卡
    arguments:
      instrument_id: SH.600519
      snapshot_id: snap-universe

- capability_id: aquant.event_evidence.read
  version: 1.0.0
  title: 读取事件证据
  description: 读取固定已发布快照内、经过可用时点过滤的事件证据；不抓取来源、不写入事实
  when_to_use:
  - 查询证券在快照时点已可用的事件证据
  - 核对事件的来源授权与引用
  when_not_to_use:
  - 要求即时联网检索或读取未发布数据
  handler: aquant_lab_agentctl_handlers:event_evidence_read
  input_schema:
    type: object
    required:
    - instrument_id
    - snapshot_id
    properties:
      instrument_id:
        type: string
      snapshot_id:
        type: string
      located_only:
        type: boolean
      limit:
        type: integer
        minimum: 1
        maximum: 100
    additionalProperties: false
  output_schema:
    type: object
    required:
    - ok
    - snapshot_id
    - as_of_time
    - instrument_id
    - evidence
    properties:
      ok:
        type: boolean
      snapshot_id:
        type: string
      as_of_time:
        type: string
      data_mode:
        type: string
      watermark:
        type: string
      instrument_id:
        type: string
      count:
        type: integer
      evidence:
        type: array
      pit_filter:
        type: string
  result_object_types:
  - artifact_ref
  - evidence_ref
  side_effect_class: none
  risk_level: R1
  data_sensitivity: D1
  required_scopes:
  - aquant.research.read
  confirmation_policy: none
  idempotency:
    required: true
    scope: tenant_actor_capability

- capability_id: aquant.portfolio.read
  version: 1.0.0
  title: 读取组合账本
  description: 读取产品持久化的模拟组合现金与持仓；只读，主体范围由已验证调用上下文提供
  when_to_use:
  - 查询模拟组合当前现金与持仓
  when_not_to_use:
  - 要求改动现金、持仓或成交记录
  handler: aquant_lab_agentctl_handlers:portfolio_read
  input_schema:
    type: object
    required:
    - portfolio_id
    properties:
      portfolio_id:
        type: string
    additionalProperties: false
  output_schema:
    type: object
    required:
    - ok
    - portfolio_id
    - cash
    - positions
    properties:
      ok:
        type: boolean
      portfolio_id:
        type: string
      cash:
        type: object
      positions:
        type: array
      subject_scope:
        type: string
      actor_user_id:
        type: string
      read_only:
        type: boolean
  result_object_types:
  - artifact_ref
  side_effect_class: none
  risk_level: R1
  data_sensitivity: D1
  required_scopes:
  - aquant.portfolio.read
  confirmation_policy: none
  idempotency:
    required: true
    scope: tenant_actor_capability

- capability_id: aquant.simulation_plan.preview
  version: 1.0.0
  title: 预览模拟计划
  description: 使用已发布快照与产品账本计算模拟计划；只算不冻，不写计划、订单或成交
  when_to_use:
  - 在固定决策快照下预览组合调仓
  when_not_to_use:
  - 要求冻结计划、提交订单或产生成交
  handler: aquant_lab_agentctl_handlers:simulation_plan_preview
  input_schema:
    type: object
    required:
    - portfolio_id
    - snapshot_id
    - trading_day
    properties:
      portfolio_id:
        type: string
      snapshot_id:
        type: string
      trading_day:
        type: string
      candidates:
        type: array
      decision_snapshot_id:
        type: string
      decision_cutoff_at:
        type: string
      execution_snapshot_id:
        type: string
      cash_available_cents:
        type: integer
    additionalProperties: false
  output_schema:
    type: object
    required:
    - ok
    - plan_id
    - portfolio_id
    - snapshot_id
    - frozen
    - orders
    properties:
      ok:
        type: boolean
      plan_id:
        type: string
      portfolio_id:
        type: string
      snapshot_id:
        type: string
      trading_day:
        type: string
      frozen:
        type: boolean
      frozen_label:
        type: string
      orders:
        type: array
      targets:
        type: array
      estimated_fees_cents:
        type: integer
      read_only:
        type: boolean
  result_object_types:
  - artifact_ref
  side_effect_class: none
  risk_level: R1
  data_sensitivity: D1
  required_scopes:
  - aquant.simulation.read
  confirmation_policy: none
  idempotency:
    required: true
    scope: tenant_actor_capability

- capability_id: aquant.experiment.submit
  version: 1.0.0
  title: 提交研究实验
  description: 通过产品 JobStore 提交幂等的研究实验作业；仅创建研究作业，不执行交易或写账本
  when_to_use:
  - 提交固定快照上的因子或证据研究作业
  when_not_to_use:
  - 要求执行订单、写账本或改变模拟组合
  handler: aquant_lab_agentctl_handlers:experiment_submit
  input_schema:
    type: object
    required:
    - job_type
    - trading_day
    - snapshot_id
    properties:
      job_type:
        type: string
      trading_day:
        type: string
      snapshot_id:
        type: string
      config_version:
        type: string
      payload:
        type: object
    additionalProperties: false
  output_schema:
    type: object
    required:
    - ok
    - jobId
    - status
    - idempotencyKey
    - job_ref
    properties:
      ok:
        type: boolean
      jobId:
        type: string
      created:
        type: boolean
      status:
        type: string
      snapshotId:
        type: string
      idempotencyKey:
        type: string
      job_id:
        type: string
      idempotency_key:
        type: string
      actor_user_id:
        type: string
      job_ref:
        type: object
  result_object_types:
  - job_ref
  side_effect_class: internal
  risk_level: R2
  data_sensitivity: D1
  required_scopes:
  - aquant.experiment.submit
  confirmation_policy: policy
  async_mode: job
  job_lifecycle:
    role: submit
    status_capability_id: aquant.job.status
  idempotency:
    required: true
    scope: tenant_actor_capability

- capability_id: aquant.job.status
  version: 1.0.0
  title: 查询研究作业状态
  description: 查询产品持久化 Research JobStore 中指定研究作业的权威状态、错误与已落库结果
  when_to_use:
  - 查询研究作业状态
  - 查询研究作业的持久化结果
  when_not_to_use:
  - 要求重新执行或取消研究作业
  handler: aquant_lab_agentctl_handlers:job_status
  input_schema:
    type: object
    required:
    - job_id
    properties:
      job_id:
        type: string
    additionalProperties: false
  output_schema:
    type: object
    required:
    - ok
    - jobId
    - status
    - job_ref
    properties:
      ok:
        type: boolean
      jobId:
        type: string
      jobType:
        type: string
      status:
        type: string
      tradingDay:
        type: string
      attemptCount:
        type: integer
      leaseOwner:
        type: string
      leaseExpiresAt:
        type: string
      errorCode:
        type: string
      errorDetail:
        type: string
      idempotencyKey:
        type: string
      snapshotId:
        type: string
      configVersion:
        type: string
      result:
        type: object
      actor_user_id:
        type: string
        description: 经平台验证且与持久作业归属匹配的调用主体
      job_ref:
        type: object
  result_object_types:
  - job_ref
  side_effect_class: none
  risk_level: R0
  data_sensitivity: D1
  required_scopes:
  - aquant.job.read
  confirmation_policy: none
  async_mode: job
  job_lifecycle:
    role: status
  idempotency:
    required: true
    scope: tenant_actor_capability
