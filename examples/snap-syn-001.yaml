# 合成数据集 snap-syn-001
# 主文档 §15.4：SYNTHETIC 模式强制水印，且禁止与真实行情混成单一收益曲线。
# v0.2.2 §4.3：Q0–Q2 不应等供应商合同，先用合成数据集让验收可确定性运行。
#
# 本数据集刻意设计为可覆盖 D01–D08 与 S01–S10 的判定分支，
# 不是"看起来像真的"的随机数（主文档 §19："不要先交付充满漂亮随机数字的排行榜"）。

schema_version: aquant.synthetic_dataset.v1
data_mode: SYNTHETIC
watermark: "SYNTHETIC DATA -- NOT VALID FOR RESEARCH CONCLUSIONS"
disclaimer: "全部数值为虚构，仅用于契约与确定性测试；不得用于任何收益结论。"

snapshot_id: snap-syn-001
as_of_time: "2026-09-11T20:30:00+08:00"
input_cutoff_at: "2026-09-11T12:30:00Z"     # = 20:30 Asia/Shanghai
published_at: "2026-09-11T12:31:00Z"

# 交易日历：与真实沪深交易日无关，仅为本数据集内的确定性序列
trading_days:
  - "2026-09-07"
  - "2026-09-08"
  - "2026-09-09"
  - "2026-09-10"
  - "2026-09-11"

