        industry_code: SW_SYN_02
        industry_name: 合成银行

  # S02 用途：2026-09-09 开盘涨停（买入应不成交，且不得编造资金）
  - instrument_id: SYN.A.300001
    exchange: SZSE
    board: GEM
    security_class: EQUITY
    short_name: 合成示例·涨停
    listed_on: "2021-03-15"
    status: LISTED
    industry_code: SW_SYN_03
    industry_name: 合成电子
    # §3.1 创业板可展示但不进入默认可模拟池
    simulatable: false
    status_history:
      - valid_from: "2021-03-15"
        valid_to: null
        name: 合成示例·涨停
        status: LISTED
        industry_code: SW_SYN_03
        industry_name: 合成电子

  # S08 用途：2026-09-10 起停牌（不制造成交，估值用最近有效价 + 停牌天数）
  - instrument_id: SYN.A.600002
    exchange: SSE
    board: MAIN
    security_class: EQUITY
    short_name: 合成示例·停牌
    listed_on: "2018-07-01"
    status: SUSPENDED
    suspended_from: "2026-09-10"
    industry_code: SW_SYN_04
    industry_name: 合成医药
    # status_history 是状态查询的唯一权威（§15.2 按有效期版本化）。
    # 仅声明 status 字段而不给历史版本，会让历史时点查询返回空——
    # 这正是 D05 要防的"用当前状态回答历史问题"。
    status_history:
      - valid_from: "2018-07-01"
        valid_to: "2026-09-10"
        name: 合成示例·停牌
        status: LISTED
        industry_code: SW_SYN_04
        industry_name: 合成医药
      - valid_from: "2026-09-10"
        valid_to: null
        name: 合成示例·停牌
        status: SUSPENDED
        industry_code: SW_SYN_04
        industry_name: 合成医药

  # S07 用途：除权日与到账日不同日（应收与现金正确迁移，不重复计收益）
  - instrument_id: SYN.A.600003
    exchange: SSE
    board: MAIN
    security_class: EQUITY
    short_name: 合成示例·分红
    listed_on: "2017-11-20"
    status: LISTED
    industry_code: SW_SYN_05
    industry_name: 合成公用事业
    status_history:
      - valid_from: "2017-11-20"
        valid_to: null
        name: 合成示例·分红
        status: LISTED
        industry_code: SW_SYN_05
        industry_name: 合成公用事业

